<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="-42 -112 84 120" xmlns="http://www.w3.org/2000/svg" width="336" height="480"><style>
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.85}100%{transform:translateY(-40px) scale(1.5);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes ring{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.spin{animation:spin 3.5s linear infinite}
.puff{animation:rise 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:6 6;animation:flow .8s linear infinite}
.bob{animation:bob 2.4s ease-in-out infinite}
.ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.glow{animation:glow 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="en-tower" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef2f6"/><stop offset=".56" stop-color="#cfd8e1"/><stop offset="1" stop-color="#b9c5d1"/></linearGradient><linearGradient id="en-blade" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5dee7"/></linearGradient></defs><g transform="translate(0.0,0.0)" ><ellipse rx="9" ry="3.6" fill="#0b1e33" opacity=".16"/><ellipse rx="5.5" ry="2.4" fill="#cfd5db"/><path d="M-2.8 0L-1.1 -72H1.1L2.8 0Z" fill="url(#en-tower)"/><rect x="-1" y="-4.2" width="2" height="3.6" rx=".6" fill="#7d8b99"/><path d="M-2.6 -74.4h7.6a2.2 2.2 0 0 1 0 4.4h-7.6Z" fill="#e9eef3" stroke="#b2bfcc" stroke-width=".4"/><circle cx="6.4" cy="-74.6" r="1" fill="#e04a3f" class="glow" style="animation-delay:1.4s"/><g transform="translate(-2.8,-72)"><g class="spin" style="animation-duration:5.2s;animation-delay:-1.4s"><path d="M0 0C1.8 -6 2.6 -18.2 .5 -33.1L-.5 -33.1C-1.2 -19.9 -1.6 -6.6 0 0Z" fill="url(#en-blade)" stroke="#aebccb" stroke-width=".4"/><g transform="rotate(120)"><path d="M0 0C1.8 -6 2.6 -18.2 .5 -33.1L-.5 -33.1C-1.2 -19.9 -1.6 -6.6 0 0Z" fill="url(#en-blade)" stroke="#aebccb" stroke-width=".4"/></g><g transform="rotate(240)"><path d="M0 0C1.8 -6 2.6 -18.2 .5 -33.1L-.5 -33.1C-1.2 -19.9 -1.6 -6.6 0 0Z" fill="url(#en-blade)" stroke="#aebccb" stroke-width=".4"/></g></g><circle r="2.1" fill="#f4f7fa" stroke="#aebccb" stroke-width=".5"/></g></g></svg>
