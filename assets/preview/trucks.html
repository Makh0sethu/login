<!doctype html>
<html><head><meta charset="utf-8"><title>Tanker trucks preview</title>
<style>
  body{background:#eef3f8;font-family:Segoe UI,Arial,sans-serif;margin:16px;color:#1d2b3a}
  .grid{display:flex;flex-wrap:wrap;gap:14px}
  .tile{background:#fff;border-radius:10px;padding:6px;box-shadow:0 1px 4px #0001}
  .tile p{margin:2px 6px;font-size:12px}
  svg{overflow:visible;display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.85}100%{transform:translateY(-40px) scale(1.5);opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  @keyframes ring{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.7);opacity:0}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes flick{0%,100%{opacity:1}45%{opacity:.55}55%{opacity:1}70%{opacity:.7}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .spin{animation:spin 3.5s linear infinite}
  .spin.slow{animation-duration:6s}
  .puff{animation:rise 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .flow{stroke-dasharray:6 6;animation:flow .8s linear infinite}
  .bob{animation:bob 2.4s ease-in-out infinite}
  .ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .glow{animation:glow 1.6s ease-in-out infinite}
  .flick{animation:flick 3s ease-in-out infinite}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style></head>
<body>
<h3>Assets.trucks</h3>
<div class="grid" id="g"></div>
<script src="../core.js"></script>
<script src="../iso.js"></script>
<script src="../trucks.js"></script>
<script>
Assets.mountDefs();
const g = document.getElementById('g');
const tile = (title, inner, w = 360, h = 220, vb = '-22 -16 44 27') =>
  g.insertAdjacentHTML('beforeend', `<div class="tile"><p>${title}</p><svg width="${w}" height="${h}" viewBox="${vb}">${inner}</svg></div>`);
const T_ = Assets.trucks;
const variants = [
  {livery:'petrotrade'},
  {livery:'noic'},
  {tank:'white', cab:'red', label:'NOIC'},
  {tank:'green', cab:'gold', label:'PETROTRADE'},
  {tank:'silver', cab:'blue', label:'FUEL'},
  {tank:'yellow', cab:'white', label:''},
];
variants.forEach(o => tile(`iso tanker ${o.livery || o.tank + '/' + o.cab}`, T_.tanker(o)));
// iso drive on a road
tile('iso drive (Petrotrade)', ground(-60, 26, 120, 16, '#9aa5b1') + T_.drive(-50, 34, 50, 34, 8, -2, {livery:'petrotrade'}), 520, 300, '-80 -50 160 100');
// NOIC oblique
const Piso = P;
P = (x, y, z = 0) => [x - y * 0.55, y * 0.7 - z];
variants.forEach(o => tile(`oblique tanker ${o.livery || o.tank + '/' + o.cab}`, T_.tanker(o)));
tile('oblique drive (NOIC)', ground(-90, 30, 180, 14, '#9aa5b1') + T_.drive(-80, 37, 80, 37, 9, 0, {livery:'noic'}) + T_.drive(-80, 37, 80, 37, 9, -4.5, {livery:'petrotrade'}), 520, 220, '-100 -20 200 60');
P = Piso;
</script>
</body></html>
