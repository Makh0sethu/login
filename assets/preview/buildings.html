<!doctype html>
<html><head><meta charset="utf-8"><title>Buildings preview</title>
<style>
  body{margin:0;padding:16px;background:#eef3f8;font-family:Segoe UI,Arial,sans-serif;color:#1d2b3a}
  h2{font-size:14px;margin:18px 0 6px}
  .row{display:flex;flex-wrap:wrap;gap:10px}
  .tile{background:#f6f9fc;border:1px solid #dbe4ee;border-radius:8px;padding:4px}
  .tile p{margin:2px 0 0;font-size:11px;text-align:center;color:#56626f}
  svg{overflow:visible;display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.85}100%{transform:translateY(-40px) scale(1.5);opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  @keyframes ring{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.7);opacity:0}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes flick{0%,100%{opacity:1}45%{opacity:.55}55%{opacity:1}70%{opacity:.7}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .spin{animation:spin 3.5s linear infinite}
  .spin.slow{animation-duration:6s}
  .puff{animation:rise 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .flow{stroke-dasharray:6 6;animation:flow .8s linear infinite}
  .bob{animation:bob 2.4s ease-in-out infinite}
  .ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .glow{animation:glow 1.6s ease-in-out infinite}
  .flick{animation:flick 3s ease-in-out infinite}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style></head>
<body>
<div id="out"></div>
<script src="../core.js"></script>
<script src="../iso.js"></script>
<script src="../buildings.js"></script>
<script>
  Assets.mountDefs();
  const B = Assets.buildings, out = document.getElementById('out');
  const tile = (inner, label, vb = '-30 -80 62 96', W = 200, H = 310) =>
    `<div class="tile"><svg viewBox="${vb}" width="${W}" height="${H}">${inner}</svg><p>${label}</p></div>`;
  let html = '';
  B.styles.forEach((st, si) => {
    html += `<h2>${st}</h2><div class="row">`;
    [20, 30, 42].forEach((h, hi) => html += tile(plate(15, 15) + B.building(-11, -11, 22, 22, h, { style: st, seed: si * 3 + hi, delay: hi * .4 }), `${st} h=${h}`));
    html += '</div>';
  });
  // a city block like scenePtel, auto styles
  const list = [[-70, -50, 22, 22, 40], [-44, -56, 20, 20, 26], [-72, -20, 20, 20, 22], [30, -52, 24, 24, 34], [58, -26, 22, 20, 20]];
  html += `<h2>block() with scenePtel boxes (auto style) + NOIC oblique</h2><div class="row">`;
  html += tile(plate(88, 70) + B.block(list, { seed: 2 }), 'block, iso', '-150 -110 300 220', 600, 440);
  const P0 = P;
  P = (x, y, z = 0) => [x - y * 0.55, y * 0.7 - z];
  html += tile(B.building(-11, -11, 22, 22, 34, { style: 'glass', seed: 4 }) + B.building(20, -11, 18, 18, 22, { style: 'retail', seed: 1 }), 'oblique (NOIC P)', '-40 -80 100 110', 230, 250);
  P = P0;
  html += '</div>';
  out.innerHTML = html;
</script>
</body></html>
