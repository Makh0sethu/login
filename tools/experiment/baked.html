<!doctype html>
<meta charset="utf-8"><base href="../../">
<title>baked-map experiment</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#8cc55c}
#map,#base{position:fixed;inset:0;width:100%;height:100%;display:block}
#base{object-fit:cover}</style>
<svg id="map" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg>
<script>
// ?mode=svg (current) | baked (static top-level groups -> one PNG, animated ones stay SVG) ; &scale=2
const q = new URLSearchParams(location.search), MODE = q.get('mode') || 'svg', SCALE = +(q.get('scale') || 2);
window.__ready = false; window.__stats = {};
</script>
<script src="src/core.js"></script><script src="src/iso.js"></script>
<script src="src/assets/terrain.js"></script><script src="src/assets/textures.js"></script>
<script src="src/assets/silos.js"></script><script src="src/assets/marine.js"></script>
<script src="src/assets/trucks.js"></script><script src="src/assets/cars.js"></script>
<script src="src/assets/houses.js"></script><script src="src/assets/buildings.js"></script>
<script src="src/assets/tanks.js"></script><script src="src/assets/energy.js"></script>
<script src="src/assets/crew.js"></script><script src="art/manifest.js"></script>
<script src="src/exports.js"></script><script src="src/map.js"></script>
<script>
(async () => { try {
  const NS = 'http://www.w3.org/2000/svg', t0 = performance.now();
  Assets.mountDefs();
  const markup = Assets.map.render();
  const map = document.getElementById('map');
  if (MODE === 'svg') { map.innerHTML = markup; }
  else {
    const tmp = document.createElementNS(NS, 'svg'); tmp.innerHTML = markup;
    const root = tmp.querySelector(':scope > g');           // translate(CX,CY) wrapper
    const kids = [...root.children];
    const animated = k => k.tagName !== 'defs' && k.querySelector('animate,animateMotion,animateTransform,set');
    const dyn = kids.filter(animated), stat = kids.filter(k => !animated(k));
    const total = root.querySelectorAll('*').length;
    const statNodes = stat.reduce((n, k) => n + 1 + k.querySelectorAll('*').length, 0);
    // static svg = same root, only static kids
    const sroot = root.cloneNode(false); stat.forEach(k => sroot.appendChild(k.cloneNode(true)));
    let body = sroot.outerHTML;
    const hrefs = [...new Set([...body.matchAll(/href="([^"#][^"]*)"/g)].map(m => m[1]).filter(h => !h.startsWith('data:')))];
    for (const h of hrefs) { try { const b = await (await fetch(h)).blob(); const d = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); body = body.split('href="' + h + '"').join('href="' + d + '"'); } catch (e) {} }
    const svgText = `<svg xmlns="${NS}" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" width="${1600 * SCALE}" height="${1000 * SCALE}"><defs>${Assets.defsMarkup()}</defs>${body}</svg>`;
    const img = new Image();
    img.src = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml' }));
    __stats.stage='decode'; await img.decode(); __stats.stage='drawn';
    const cv = new OffscreenCanvas(1600 * SCALE, 1000 * SCALE);
    cv.getContext('2d').drawImage(img, 0, 0);
    const png = await cv.convertToBlob({ type: 'image/png' }); __stats.stage='png';
    URL.revokeObjectURL(img.src);
    const pngPx = cv.width + 'x' + cv.height; cv.width = cv.height = 0; img.src = '';                 // free the scratch canvas / svg image
    const base = new Image(); base.id = 'base'; base.src = URL.createObjectURL(png); await new Promise(r => { base.onload = base.onerror = r; });
    document.body.insertBefore(base, map);
    // overlay: only the animated groups (+ the defs they reference come from the mounted defs host)
    const defs = tmp.querySelector('defs');
    map.innerHTML = (defs ? defs.outerHTML : '') + root.cloneNode(false).outerHTML.replace(/<\/g>$/, '');
    const oroot = map.querySelector(':scope > g'); dyn.forEach(k => oroot.appendChild(k));
    Object.assign(__stats, { pngBytes: png.size, pngPx, topLevel: kids.length, animatedTop: dyn.length,
      totalNodes: total, staticNodes: statNodes, svgTextBytes: svgText.length });
  }
  await new Promise(r => setTimeout(r, 1500));
  __stats.setupMs = Math.round(performance.now() - t0);
  __stats.markupBytes = markup.length;
  __ready = true;
} catch (e) { __stats.error = String(e && e.stack || e); __ready = true; } })();
// frame sampler
window.sampleFrames = ms => new Promise(res => { const d = []; let last = performance.now(), end = last + ms;
  (function f(t) { d.push(t - last); last = t; t < end ? requestAnimationFrame(f) : res({ frames: d.length, avgMs: +(d.reduce((a, b) => a + b, 0) / d.length).toFixed(2), p95: +d.sort((a, b) => a - b)[Math.floor(d.length * .95)].toFixed(1) }); })(last); });
</script>
