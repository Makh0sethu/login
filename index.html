<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy Sector Portal - Sign in</title>
<style>
  :root{
    --ink:#1d2b3a; --muted:#5d6f82; --accent:#1f7fc0; --accent-d:#17608f; --line:#cfdae5;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:#8cc55c;overflow:hidden}

  /* full-bleed landscape behind everything (built by src/map.js) */
  #map{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  .page{position:relative;z-index:1;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;pointer-events:none}
  .page>*{pointer-events:auto}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px clamp(14px,2.5vw,36px) 14px;
    background:linear-gradient(180deg,rgba(236,246,228,.94),rgba(236,246,228,.78) 70%,rgba(236,246,228,0));}
  .badge{flex:none;width:68px;height:68px;border-radius:50%;background:#fff;border:2px solid #fff;
    box-shadow:0 4px 14px rgba(20,50,80,.18);position:relative;overflow:hidden}
  /* pinned to the badge box, so a tall or wide image can't stretch the badge */
  .badge img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px}
  .badge.crest{border-radius:10px;width:200px;height:148px;background:transparent;box-shadow:none;border:0}
  .badge.crest img{padding:0}
  .badge.seal{width:152px;height:152px}
  .badge.seal img{padding:9px}
  .titles{flex:1;text-align:center;color:#000}
  .titles h1{font-size:clamp(1.05rem,2.4vw,1.6rem);font-weight:800;letter-spacing:.01em;line-height:1.2;text-transform:uppercase}
  .titles h2{font-size:clamp(.9rem,2vw,1.35rem);font-weight:500;letter-spacing:.02em;line-height:1.3;margin-top:4px;text-transform:uppercase}

  main{display:grid;place-items:center;padding:8px 16px;pointer-events:none}
  /* map mode (the eye button, or M): the page's header, form and footer fade away, leaving the animated map */
  .page{transition:opacity .6s}
  body.map-mode .page,body.map-mode #dbg-btn{opacity:0;pointer-events:none}
  #view{position:fixed;left:14px;bottom:14px;z-index:30;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.85);cursor:pointer;
    display:grid;place-items:center;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);box-shadow:0 6px 18px rgba(20,50,80,.18)}
  #view:hover{background:#fff}
  #view .shut,body.map-mode #view .open{display:none}
  body.map-mode #view .shut{display:block}

  /* login */
  form{pointer-events:auto;width:min(100%,380px);background:rgba(255,255,255,.55);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);
    border:1px solid rgba(255,255,255,.85);border-radius:18px;padding:22px 24px 18px;box-shadow:0 14px 40px rgba(20,50,80,.22)}
  form h3{font-size:.85rem;font-weight:600;text-align:center;margin-bottom:14px;text-transform:uppercase;letter-spacing:.04em}
  .field{position:relative;margin-bottom:12px}
  .field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:rgba(255,255,255,.85);transition:border .2s,box-shadow .2s}
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,127,192,.18);background:#fff}
  .field button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--accent-d);font-size:.78rem;font-weight:600;cursor:pointer;padding:6px}
  .row{display:flex;justify-content:center;align-items:center;font-size:.8rem;margin:10px 0 0}
  .row a{color:var(--accent-d);text-decoration:none;font-weight:600}
  .go{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;font:inherit;font-weight:700;cursor:pointer;
    transition:transform .15s,box-shadow .2s;box-shadow:0 6px 14px rgba(31,127,192,.35)}
  .go:hover{transform:translateY(-1px);box-shadow:0 9px 18px rgba(31,127,192,.4)}
  #msg{min-height:1.1em;text-align:center;font-size:.8rem;margin-top:8px;color:var(--accent-d)}

  /* footer logos on a glass bar */
  footer{display:flex;justify-content:space-around;align-items:flex-start;gap:10px;margin:0 clamp(8px,6vw,120px) 10px;padding:10px 2% 8px;
    background:rgba(255,255,255,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.7);border-radius:16px;box-shadow:0 8px 24px rgba(20,50,80,.15)}
  footer .ent{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);flex:1 1 0;min-width:0;max-width:124px}
  footer .ent span{font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;text-align:center}
  /* badges shrink with the bar; 15% padding keeps every logo inside the square that fits the circle, so no corner is cut */
  footer .badge{width:100%;max-width:104px;height:auto;aspect-ratio:1;transition:transform .25s}
  footer .badge img{padding:15%}
  /* wide wordmark: keep the circular badge, but let the image use nearly the full width of the circle */
  footer .badge.fit img{padding:4% 3%}
  footer .ent:hover .badge{transform:translateY(-5px) scale(1.06)}

  /* ---- animations used by the map ---- */
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.85}100%{transform:translateY(-40px) scale(1.5);opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  @keyframes ring{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.7);opacity:0}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes flick{0%,100%{opacity:1}45%{opacity:.55}55%{opacity:1}70%{opacity:.7}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .spin{animation:spin 3.5s linear infinite}
  .spin.slow{animation-duration:6s}
  .puff{animation:rise 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .flow{stroke-dasharray:6 6;animation:flow .8s linear infinite}
  .bob{animation:bob 2.4s ease-in-out infinite}
  .ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .glow{animation:glow 1.6s ease-in-out infinite}
  .flick{animation:flick 3s ease-in-out infinite}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes drift{0%{transform:translate(-1000px,-120px);opacity:0}6%,94%{opacity:1}100%{transform:translate(1000px,120px);opacity:0}}
  .drift{animation:drift 110s linear infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

  @media (max-width:760px){
    .badge.crest{width:96px;height:72px}
    .badge.seal{width:76px;height:76px}
    footer{flex-wrap:wrap;justify-content:center;margin:0 8px 8px}
    footer .ent{flex:none;width:84px}
    footer .badge{max-width:68px}
  }
  @media (max-height:640px){ body{overflow:auto} .page{height:auto;min-height:100vh} }
</style>
</head>
<body>
<svg id="map" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

<div class="page">
  <header>
    <div class="badge crest" title="Government of Zimbabwe"><img src="logos/coat-of-arms.png" alt="Zimbabwe coat of arms"></div>
    <div class="titles">
      <h1>Ministry of Energy and Power Development</h1>
      <h2>Spatial Data Infrastructure System</h2>
    </div>
    <div class="badge seal" title="Ministry of Energy &amp; Power Development"><img src="logos/moepd.png" alt="Ministry of Energy and Power Development"></div>
  </header>

  <main>
    <form id="login" autocomplete="on">
      <h3>Sign in</h3>
      <div class="field"><input id="u" name="username" type="text" placeholder="Username" autocomplete="username" required></div>
      <div class="field"><input id="p" name="password" type="password" placeholder="Password" autocomplete="current-password" required><button type="button" id="eye">Show</button></div>
      <button class="go" type="submit">Sign in</button>
      <div class="row"><a href="#">Forgot password?</a></div>
      <div id="msg" role="status"></div>
    </form>
  </main>

  <footer>
    <a class="ent" href="#"><div class="badge"><img src="logos/zesa.png" alt="ZESA"></div><span>ZESA Pvt Ltd</span></a>
    <a class="ent" href="#"><div class="badge"><img src="logos/powertel.png" alt="Powertel"></div><span>Powertel</span></a>
    <a class="ent" href="#"><div class="badge"><img src="logos/zent.png" alt="ZENT"></div><span>ZENT</span></a>
    <a class="ent" href="#"><div class="badge"><img src="logos/zera.png" alt="ZERA"></div><span>ZERA</span></a>
    <a class="ent" href="#"><div class="badge"><img src="logos/ref.png" alt="REF"></div><span>REF</span></a>
    <a class="ent" href="#"><div class="badge"><img src="logos/noic.png" alt="NOIC"></div><span>NOIC</span></a>
    <a class="ent" href="#"><div class="badge"><img src="logos/petrotrade.png" alt="Petrotrade"></div><span>Petrotrade</span></a>
    <a class="ent" href="#"><div class="badge fit"><img src="logos/petrozim-line-crop.png" alt="Petrozim Line"></div><span>Petrozim Line</span></a>
    <a class="ent" href="#"><div class="badge"><img src="logos/SAP.png" alt="SAPP"></div><span>SAPP</span></a>
  </footer>
</div>

<button type="button" id="view" title="Hide the sign-in page (M)" aria-pressed="false">
  <svg class="open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  <svg class="shut" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7c2 0 3.7.7 5.1 1.6M22 12s-3.6 7-10 7c-2 0-3.7-.7-5.1-1.6M3 3l18 18"/></svg>
</button>

<script src="src/core.js"></script>
<script src="src/iso.js"></script>
<script src="src/assets/terrain.js"></script>
<script src="src/assets/textures.js"></script>
<script src="src/assets/silos.js"></script>
<script src="src/assets/marine.js"></script>
<script src="src/assets/trucks.js"></script>
<script src="src/assets/cars.js"></script>
<script src="src/assets/houses.js"></script>
<script src="src/assets/buildings.js"></script>
<script src="src/assets/tanks.js"></script>
<script src="src/assets/energy.js"></script>
<script src="src/assets/crew.js"></script>
<script src="art/manifest.js"></script>
<script src="src/exports.js"></script>
<script src="src/map.js"></script>
<script src="src/debug.js"></script>
<script>
Assets.mountDefs();
document.getElementById('map').innerHTML = Assets.map.render();

/* ---------- map mode ----------
   The eye button (bottom left) or M (outside the form's fields) hides the header, form and footer, leaving the animated
   map; the same again, or Esc, brings them back. */
(function () {
  const btn = document.getElementById('view');
  let on = false;
  function mapMode(m) {
    on = m;
    document.body.classList.toggle('map-mode', m);
    btn.setAttribute('aria-pressed', m);
    btn.title = m ? 'Show the sign-in page (M)' : 'Hide the sign-in page (M)';
    if (m && document.activeElement && document.activeElement !== btn) document.activeElement.blur();
  }
  btn.addEventListener('click', () => mapMode(!on));
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || (e.target.closest && e.target.closest('input,textarea,select'))) return;
    if (e.key === 'm' || e.key === 'M') mapMode(!on);
    else if (e.key === 'Escape' && on) mapMode(false);
    else return;
    e.preventDefault();
  });
})();

/* ---------- form behaviour (front-end demo only) ---------- */
const pw = document.getElementById('p'), eye = document.getElementById('eye');
eye.addEventListener('click', () => { const show = pw.type === 'password'; pw.type = show ? 'text' : 'password'; eye.textContent = show ? 'Hide' : 'Show'; });
document.getElementById('login').addEventListener('submit', e => {
  e.preventDefault();
  document.getElementById('msg').textContent = 'Connect this form to your authentication service to sign in.';
});
</script>
</body>
</html>
