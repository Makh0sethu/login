<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marine assets preview</title>
<style>
  body{margin:0;padding:16px;background:#eef3f8;font-family:Segoe UI,Arial,sans-serif;color:#1d2b3a}
  .grid{display:flex;flex-wrap:wrap;gap:16px}
  .tile{background:#fff;border-radius:10px;padding:8px;box-shadow:0 2px 8px rgba(20,50,80,.08)}
  .tile h4{margin:0 0 4px;font-size:12px;font-weight:600}
  svg{overflow:visible;display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.85}100%{transform:translateY(-40px) scale(1.5);opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  @keyframes ring{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.7);opacity:0}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes flick{0%,100%{opacity:1}45%{opacity:.55}55%{opacity:1}70%{opacity:.7}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .spin{animation:spin 3.5s linear infinite}
  .spin.slow{animation-duration:6s}
  .puff{animation:rise 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .flow{stroke-dasharray:6 6;animation:flow .8s linear infinite}
  .bob{animation:bob 2.4s ease-in-out infinite}
  .ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .glow{animation:glow 1.6s ease-in-out infinite}
  .flick{animation:flick 3s ease-in-out infinite}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script src="../../core.js"></script>
<script src="../../iso.js"></script>
<script src="../marine.js"></script>
<script>
Assets.mountDefs();
const M = Assets.marine, grid = document.getElementById('grid');
function tile(title, w, h, vb, markup) {
  grid.insertAdjacentHTML('beforeend', `<div class="tile"><h4>${title}</h4><svg width="${w}" height="${h}" viewBox="${vb}">${markup}</svg></div>`);
}
function oblique(fn) {
  const prev = P; P = (x, y, z = 0) => [x - y * 0.55, y * 0.7 - z];
  try { return fn(); } finally { P = prev; }
}
// NOIC scene excerpt in the oblique projection (sea strip, tanker, rig) at 2x
tile('NOIC oblique: sea + tanker + rig (2x)', 620, 360, '-250 -110 155 120', oblique(() =>
  poly([P(-212, -56, 0), P(-150, -56, 0), P(-150, 56, 0), P(-212, 56, 0)], '#f6f9fc') +
  M.sea(-212, -56, -166, 56) + M.rig(-210, -54, { scale: .55 }) + M.tanker(-206, -22) ));
tile('Oblique: tanker alone (3x)', 420, 300, '-225 -50 70 50', oblique(() => M.sea(-240, -40, -150, 20, { shore: 'none' }) + M.tanker(-206, -22)));
tile('Oblique: rig scale 1 (3x)', 360, 380, '-40 -90 90 95', oblique(() => M.sea(-20, -20, 70, 50, { shore: 'none' }) + M.rig(0, 0)));
tile('Iso: tanker len 60, beam 16, no bob', 420, 300, '-60 -30 100 70', M.sea(-40, -30, 80, 30, { shore: 'none' }) + M.tanker(0, -8, { len: 60, beam: 16, bob: false }));
tile('Iso: rig', 360, 380, '-40 -90 90 110', M.sea(-15, -15, 60, 50, { shore: 'y1' }) + M.rig(0, 0));
tile('Iso: sea patch 120x80, shore x1', 360, 220, '-110 -60 220 130', M.sea(-60, -40, 60, 40));
</script>
</body>
</html>
