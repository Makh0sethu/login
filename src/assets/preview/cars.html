<!doctype html>
<html><head><meta charset="utf-8"><title>Cars preview</title>
<style>
  body{margin:0;padding:16px;background:#eef3f8;font-family:Segoe UI,Arial,sans-serif;color:#1d2b3a}
  h2{font-size:14px;margin:18px 0 8px}
  .grid{display:flex;flex-wrap:wrap;gap:8px}
  .tile{background:#f8fbfd;border:1px solid #d6e0ea;border-radius:8px;padding:4px;text-align:center;font-size:11px}
  svg{overflow:visible;display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.85}100%{transform:translateY(-40px) scale(1.5);opacity:0}}
  @keyframes flow{to{stroke-dashoffset:-24}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
  @keyframes ring{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.7);opacity:0}}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes flick{0%,100%{opacity:1}45%{opacity:.55}55%{opacity:1}70%{opacity:.7}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .spin{animation:spin 3.5s linear infinite}
  .spin.slow{animation-duration:6s}
  .puff{animation:rise 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .flow{stroke-dasharray:6 6;animation:flow .8s linear infinite}
  .bob{animation:bob 2.4s ease-in-out infinite}
  .ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .glow{animation:glow 1.6s ease-in-out infinite}
  .flick{animation:flick 3s ease-in-out infinite}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style></head>
<body>
<h2>Fleet liveries (dir 1 / dir -1, plus logo:false and cargo:'ladder')</h2>
<div class="grid" id="fleet"></div>
<h2>Petrotrade road: drive() both directions, and NOIC oblique projection</h2>
<div class="grid" id="road"></div>
<h2>Close-up (4x)</h2>
<div class="grid" id="big"></div>
<h2>All types x 3 colours x both directions (glow on for the dir -1 row)</h2>
<div class="grid" id="grid"></div>
<script src="../../core.js"></script>
<script>Assets.base = '../../../';</script>
<script src="../../iso.js"></script>
<script src="../cars.js"></script>
<script>
Assets.mountDefs();
const road = (pp) => {
  let s = poly([P(-88, 28, 0.3), P(88, 28, 0.3), P(88, 52, 0.3), P(-88, 52, 0.3)], '#a3adb8');
  s += `<polyline points="${pts([P(-88, 40, 0.5), P(88, 40, 0.5)])}" stroke="#fff" stroke-width="1.2" stroke-dasharray="6 5" fill="none"/>`;
  return s;
};
const colours = ['#4f7fe0', '#e0567a', '#f4f6f8'];
const grid = document.getElementById('grid');
let html = '';
Assets.cars.types.forEach(type => {
  [1, -1].forEach(dir => colours.forEach(color => {
    const g = Assets.cars.car({ type, color, dir, glow: dir === -1 });
    html += `<div class="tile"><svg width="150" height="110" viewBox="-28 -24 56 41">${g}</svg>${type} ${color} dir ${dir}</div>`;
  }));
});
grid.innerHTML = html;
let big = '';
Assets.cars.types.forEach((type, i) => [1, -1].forEach(dir => {
  big += `<div class="tile"><svg width="260" height="190" viewBox="-18 -19 36 26.5">${Assets.cars.car({ type, color: colours[i % 3], dir, glow: true })}</svg>${type} dir ${dir}</div>`;
}));
document.getElementById('big').innerHTML = big;
let fl = '';
const flt = (o, label, vb) => `<div class="tile"><svg width="300" height="220" viewBox="${vb || '-19 -20 38 28'}">${Assets.cars.car(o)}</svg>${label}</div>`;
Assets.cars.liveries.forEach(lv => [1, -1].forEach(dir => {
  fl += flt({ livery: lv, dir, glow: true }, lv + ' dir ' + dir, lv === 'zetdc-truck' ? '-24 -24 48 36' : null);
}));
fl += flt({ livery: 'moepd', logo: false }, "moepd logo:false");
fl += flt({ livery: 'zetdc-truck', cargo: 'ladder' }, "zetdc-truck cargo:'ladder'", '-24 -26 48 38');
fl += flt({ livery: 'zetdc-truck', cargo: 'ladder', dir: -1 }, "zetdc-truck ladder dir -1", '-24 -26 48 38');
document.getElementById('fleet').innerHTML = fl;

let r = '';
// iso road scene like scenePetro
let sc = road() + Assets.cars.drive(-84, 30, 80, 30, 16, -9, { livery: 'zetdc-truck' }) +
  Assets.cars.drive(-84, 34, 80, 34, 12, -5, { type: 'pickup', color: '#f4f6f8' }) +
  Assets.cars.drive(-84, 40, 80, 40, 8, 0, { type: 'sedan', color: '#4f7fe0', glow: true }) +
  Assets.cars.drive(80, 46, -84, 46, 10, -3, { type: 'hatch', color: '#ff7fa0' }) +
  Assets.cars.drive(80, 50, -84, 50, 14, -2, { type: 'minibus', color: '#ffffff' }) +
  Assets.cars.drive(80, 52, -84, 52, 11, -6, { livery: 'zera' });
r += `<div class="tile"><svg width="560" height="260" viewBox="-170 -40 340 140">${sc}</svg>iso drive()</div>`;
// oblique NOIC projection
const prevP = P;
P = (x, y, z = 0) => [x - y * 0.55, y * 0.7 - z];
let ob = '';
[...Assets.cars.types].forEach((type, i) => {
  ob += `<g transform="translate(${-80 + i * 40},0)">${Assets.cars.car({ type, color: colours[i % 3] === '#f4f6f8' ? '#2fa36b' : colours[i % 3], dir: 1 })}</g>`;
  ob += `<g transform="translate(${-80 + i * 40},30)">${Assets.cars.car({ type, color: '#f2c35c', dir: -1 })}</g>`;
});
ob += `<g transform="translate(-70,62)">${Assets.cars.car({ livery: 'zetdc', dir: 1 })}</g><g transform="translate(-20,62)">${Assets.cars.car({ livery: 'zera', dir: -1 })}</g><g transform="translate(30,62)">${Assets.cars.car({ livery: 'moepd', dir: 1 })}</g><g transform="translate(85,62)">${Assets.cars.car({ livery: 'zetdc-truck', dir: -1 })}</g>`;
P = prevP;
r += `<div class="tile"><svg width="600" height="290" viewBox="-110 -25 320 105">${ob}</svg>oblique (NOIC) P</div>`;
document.getElementById('road').innerHTML = r;
</script>
</body></html>
